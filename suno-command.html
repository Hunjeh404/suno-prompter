<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080808">
<title>Suno/Command · Track Sheet v2</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   Suno/Command v2 — Dark Music Production Console
   ---------------------------------------------------------------------
   사양서의 색·서체·라운드 규칙을 그대로 따른다.
   주황은 시선이 가야 할 곳에만. 화면 대부분은 검정과 회색.
   ===================================================================== */
:root{
  color-scheme:dark;

  /* 면 */
  --ink:#080808;        /* 페이지 */
  --panel:#101010;      /* 카드 */
  --panel-2:#141414;    /* 카드 안 중첩 */
  --well:#0A0A0A;       /* 입력·리드아웃 */

  /* 선 */
  --line:#2B2B2B;       /* 카드 테두리 */
  --line-soft:#1C1C1C;  /* 내부 구분선 */

  /* 신호 */
  --signal:#FF8A1F;
  --signal-dim:#C05812;
  --signal-wash:#17110A;
  --signal-edge:#7A4715;
  --caution:#FFC83D;
  --danger:#E05A48;
  --danger-wash:#170D0B;
  --danger-edge:#4A2622;
  /* 보조 신호 — 시스템이 읽어 주는 값(Suno에 들어갈 표현, 번호, 카운터) */
  --aux:#3DD2DB;
  --aux-wash:#0A1617;
  --aux-edge:#1D5357;

  /* 글자 — 전부 4.5:1 이상 */
  --fg:#F2F2F2;
  --fg-2:#A7A7A7;
  --fg-3:#8B8B8B;
  --off:#4A4A4A;

  /* 간격 — 대시보드 밀도 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;

  /* 라운드 */
  --r-card:16px; --r-btn:10px; --r-in:10px; --r-tag:8px;

  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
.skip{position:absolute;left:-9999px;top:0;z-index:50;background:var(--signal);color:#100A03;
      font-weight:600;padding:10px 16px;border-radius:0 0 var(--r-btn) 0;text-decoration:none}
.skip:focus{left:0}
#main:focus{outline:none}
html{color-scheme:dark}
html,body{margin:0;padding:0;overflow-x:hidden}
body{
  background:var(--ink);color:var(--fg);
  font-family:var(--font);font-size:14.5px;line-height:1.55;font-weight:400;
  -webkit-font-smoothing:antialiased;
  touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(255,138,31,.16);
}
/* 폭이 좁아져도 그리드·플렉스 자식이 밀려나지 않게 */
.wrap,.card,section.blk,.ctl,.block,.layer,.cols>*,.col-form,.col-out,.row,
.actions,.seg,.two,.proj-row,.llm-grid,.llm-form,.bar-in,.toolbar{min-width:0}

.wrap{max-width:1280px;margin:0 auto;padding:0 var(--s5) var(--s6)}
@media(max-width:560px){.wrap{padding:0 var(--s4) var(--s6)}}
@media(max-width:1100px){body{padding-bottom:calc(136px + env(safe-area-inset-bottom))}html{scroll-padding-bottom:calc(150px + env(safe-area-inset-bottom))}}

svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
.y{color:var(--caution)}.o{color:var(--signal)}.w{color:var(--fg)}
.muted{color:var(--fg-3);font-size:12.5px;line-height:1.6}
em{font-style:normal;color:var(--fg)}
h1,h2,h3{text-wrap:balance}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px}

/* ---------- 앱 바 ---------- */
.top{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  padding:var(--s4) 0 var(--s3);margin-bottom:var(--s5);
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex;align-items:center;gap:var(--s3);min-width:0}
.brand .wave{width:26px;height:26px;color:var(--signal);stroke-width:2.2}
.logo{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.sub{color:var(--fg-3);font-size:12.5px;line-height:1.4;margin-top:1px;
     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:640px){.sub{white-space:normal}}
.top-r{display:flex;align-items:center;gap:var(--s2);flex:none}
.badge{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--signal);
       border:1px solid var(--signal-edge);background:var(--signal-wash);border-radius:6px;padding:3px 8px}
.gear{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
      display:grid;place-items:center;color:var(--fg-2);text-decoration:none;flex:none;
      transition:border-color .15s,color .15s}
.gear:hover{border-color:var(--signal);color:var(--signal)}
.gear svg{width:19px;height:19px}

/* ---------- 카드 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
      padding:var(--s5) var(--s5);margin-bottom:var(--s4);scroll-margin-top:var(--s4)}
@media(max-width:560px){.card{padding:var(--s4);border-radius:14px}}
.card-title{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s4);
            font-size:17px;font-weight:600;color:var(--fg)}
.card-title svg{width:19px;height:19px;color:var(--caution)}
.card-title .opt{color:var(--fg-3);font-weight:400;font-size:14px}

/* ---------- 레이아웃 ---------- */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 460px;gap:var(--s4);align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
.col-out{position:sticky;top:var(--s3)}
@media(max-width:1100px){.col-out{position:static}}

/* ---------- 버튼 ---------- */
button{font-family:var(--font);cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
     background:var(--panel-2);border:1px solid var(--line);color:#D4D4D4;
     font-size:13.5px;font-weight:500;padding:0 var(--s3);min-height:40px;
     border-radius:var(--r-btn);white-space:nowrap;
     transition:border-color .15s,color .15s,background-color .15s}
.btn svg{width:16px;height:16px;color:var(--signal)}
.btn:hover{border-color:var(--signal);color:var(--signal);background:var(--signal-wash)}
.btn.accent{background:var(--signal-wash);border-color:var(--signal-edge);color:var(--signal)}
.btn.accent:hover{border-color:var(--signal);color:var(--caution)}
.btn.accent:hover svg{color:var(--caution)}
.btn.danger{color:var(--danger);background:var(--danger-wash);border-color:var(--danger-edge)}
.btn.danger svg{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger);color:var(--danger);background:#1D0F0D}
.btn.sm{font-size:12.5px;min-height:32px;padding:0 10px;gap:6px}
.btn.sm svg{width:14px;height:14px}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line);color:var(--off)}
.btn:disabled svg{color:var(--off)}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
@media(max-width:560px){.btn{min-height:44px}.btn.sm{min-height:36px}}

/* ---------- 작업 바 + 모드 ---------- */
.control{padding:var(--s4) var(--s5)}
@media(max-width:560px){.control{padding:var(--s4)}}
.toolbar{display:flex;align-items:center;justify-content:space-between;
         gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.stamp{display:flex;align-items:baseline;gap:var(--s2);min-width:0}
.stamp .tag{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--signal);
            border:1px solid var(--signal-edge);background:var(--signal-wash);
            border-radius:var(--r-tag);padding:3px 7px;flex:none}
.stamp .name{font-size:18px;font-weight:700;letter-spacing:-.01em;
             overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 두 모드는 동등한 선택지 — 같은 모양, 같은 무게 */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
     border:1px solid var(--line);border-radius:12px;overflow:hidden}
@media(max-width:460px){.seg{grid-template-columns:1fr}}
.seg-item{position:relative;display:flex;align-items:flex-start;gap:10px;
          background:var(--well);border:0;text-align:left;color:var(--fg-2);
          padding:13px var(--s3);min-height:60px;
          transition:background-color .15s,color .15s}
.seg-item svg{width:19px;height:19px;color:var(--fg-3);margin-top:1px;transition:color .15s}
.seg-item b{display:block;font-size:14.5px;font-weight:600;color:var(--fg);letter-spacing:.01em}
.seg-item span{display:block;min-width:0}
.seg-item small{display:block;font-size:12.5px;color:var(--fg-3);line-height:1.45;margin-top:2px}
.seg-item:hover{background:#0F0F0F;color:var(--fg)}
.seg-item[aria-pressed=true]{background:var(--signal-wash)}
.seg-item[aria-pressed=true] b{color:var(--signal)}
.seg-item[aria-pressed=true] svg{color:var(--signal)}
.seg-item[aria-pressed=true]::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--signal)}

/* ---------- 폼 섹션 ---------- */
section.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
            padding:var(--s4) var(--s5) var(--s2);margin-bottom:var(--s4);scroll-margin-top:var(--s4)}
@media(max-width:560px){section.blk{padding:var(--s4) var(--s4) var(--s2);border-radius:14px}}
section.blk[hidden]{display:none}
.blk-head{display:flex;align-items:baseline;gap:10px;padding-bottom:var(--s3);
          border-bottom:1px solid var(--line-soft);margin-bottom:var(--s1)}
.blk-no{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--aux);letter-spacing:.02em;
        border:1px solid var(--aux-edge);background:var(--aux-wash);border-radius:5px;padding:1px 6px;flex:none;
        align-self:center}
.blk-title{font-size:15px;font-weight:600;letter-spacing:.01em;margin:0}
.blk-note{color:var(--fg-3);font-size:12px;margin-left:auto;text-align:right}

.row{display:grid;grid-template-columns:118px minmax(0,1fr);gap:var(--s3);
     align-items:start;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.row:last-child{border-bottom:none}
.row[hidden]{display:none}
@media(max-width:600px){.row{grid-template-columns:1fr;gap:6px;padding:10px 0}}
.row label.k{font-size:12.5px;color:var(--fg-2);font-weight:500;padding-top:11px}
@media(max-width:600px){.row label.k{padding-top:0}}
.ctl{min-width:0}
.ctl .help{color:var(--fg-3);font-size:12px;line-height:1.55;margin-top:6px}

/* ---------- 입력 ---------- */
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;font-family:var(--font);font-size:14px;color:var(--fg);
  background:var(--well);border:1px solid var(--line);border-radius:var(--r-in);
  padding:9px var(--s3);min-height:42px;appearance:none;
  transition:border-color .15s,box-shadow .15s}
@media(max-width:600px){input[type=text],input[type=number],input[type=password],select,textarea{min-height:46px}}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238B8B8B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
        background-repeat:no-repeat;background-position:right 12px center;padding-right:36px}
textarea{resize:vertical;min-height:80px;line-height:1.6}
textarea.lyrics{min-height:270px;font-family:var(--mono);font-size:13px;line-height:1.85}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--signal);
        box-shadow:0 0 0 3px rgba(255,138,31,.14)}
input::placeholder,textarea::placeholder{color:#6E6E6E}
select option{background:#151515;color:var(--fg)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}
.chip{background:transparent;border:1px solid var(--line);color:var(--fg-2);
      font-size:12.5px;padding:5px 10px;border-radius:var(--r-tag);
      transition:border-color .15s,color .15s,background-color .15s}
.chip:hover{border-color:var(--signal);color:var(--signal)}
.chip[aria-pressed=true]{background:var(--signal-wash);border-color:var(--signal-edge);color:var(--signal)}
/* 손가락으로 쓰는 기기에서는 작은 칩도 충분한 크기로 */
@media(pointer:coarse){
  .btn.sm{min-height:40px;padding:0 12px}
  .chip{min-height:40px;padding:8px 12px;display:inline-flex;align-items:center}
  .layer .ops button{width:38px;height:36px}
  .check input[type=checkbox]{width:20px;height:20px}
}

/* ---------- 스템 작업 편집기 ---------- */
.layers{display:flex;flex-direction:column;gap:var(--s2)}
.layer{border:1px solid var(--line-soft);background:var(--well);border-radius:12px;
       padding:var(--s3);display:grid;grid-template-columns:auto minmax(0,1fr) auto;
       gap:var(--s3);align-items:start}
.layer .num{font-size:12px;color:var(--signal-dim);padding-top:12px;min-width:20px;
            font-variant-numeric:tabular-nums}
.layer .body{min-width:0;display:flex;flex-direction:column;gap:var(--s2)}
.layer .name{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.layer .name input{font-weight:600;min-height:38px;padding:7px 11px;width:auto;min-width:130px;max-width:100%}
.layer .name select{width:auto;min-width:128px;min-height:38px;padding:7px 30px 7px 11px;font-size:13px}
.layer .detail{font-size:13.5px;min-height:38px;padding:8px 11px}
.layer .ops{display:flex;flex-direction:column;gap:5px}
.layer .ops button{background:transparent;border:1px solid var(--line);color:var(--fg-2);
        font-size:13px;width:30px;height:28px;padding:0;border-radius:8px;
        transition:border-color .15s,color .15s}
.layer .ops button:hover{border-color:var(--signal);color:var(--signal)}
.layer .ops button.del:hover{border-color:var(--danger);color:var(--danger)}
.layer .ops button:disabled{opacity:.3;cursor:default}
.layer-add{display:flex;gap:var(--s2);margin-top:10px}
.layer-add input{flex:1}

/* ---------- 리드아웃 (이 화면의 주인공) ---------- */
.out-card{padding:var(--s3) var(--s4) var(--s3)}
.tabs{display:flex;gap:6px;margin-bottom:var(--s3);flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;justify-content:center;gap:6px;
     background:var(--well);border:1px solid var(--line);color:var(--fg-2);
     font-size:13px;font-weight:500;padding:0 var(--s3);min-height:38px;
     border-radius:var(--r-btn);position:relative;flex:1;
     transition:border-color .15s,color .15s,background-color .15s}
.tab svg{width:15px;height:15px}
.tab[hidden]{display:none}
.tab:hover{border-color:var(--signal-dim);color:var(--fg)}
.tab[aria-selected=true]{color:var(--signal);border-color:var(--signal-edge);background:var(--signal-wash)}
@media(max-width:560px){.tab{min-height:44px}}

.sheet{background:var(--well);border:1px solid var(--line-soft);border-radius:12px;
       padding:var(--s3) var(--s4);max-height:calc(100vh - 210px);overflow:auto;
       overscroll-behavior:contain}
@media(max-width:1100px){.sheet{max-height:none}}

.block{margin-bottom:var(--s4)}
.block:last-child{margin-bottom:0}
.block-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:6px}
.block-head .t{font-size:13px;font-weight:600;color:var(--fg);letter-spacing:.01em}
.block-head .meta{font-size:11.5px;color:var(--fg-3);margin-left:auto;
                  font-variant-numeric:tabular-nums;white-space:nowrap}
.block-head .meta.over{color:var(--danger)}

/* 채널 스트립 미터 — 남은 예산을 한눈에 */
.meter{height:3px;border-radius:2px;background:var(--line-soft);overflow:hidden;margin:0 0 var(--s2)}
.meter i{display:block;height:100%;width:100%;background:var(--signal-dim);border-radius:2px;
         transform-origin:left center;transform:scaleX(var(--v,0));
         transition:transform .2s ease-out,background-color .2s}
.meter.warn i{background:var(--caution)}
.meter.over i{background:var(--danger)}
.pips{display:flex;gap:3px;margin:0 0 var(--s2)}
.pips i{flex:1;height:3px;border-radius:2px;background:var(--line-soft)}
.pips i.on{background:var(--signal-dim)}
.pips.full i.on{background:var(--caution)}

.block pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.75;
           white-space:pre-wrap;word-break:break-word;color:var(--fg);max-width:100%;
           background:var(--panel);border:1px solid var(--line-soft);
           border-radius:10px;padding:11px var(--s3)}
.block pre.lyr{font-size:13px;line-height:1.85}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px var(--s4);font-size:13px;
    background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:11px var(--s3);
    font-variant-numeric:tabular-nums}
.kv .k{color:var(--fg-3)}

.warn{font-size:12.5px;line-height:1.65;color:var(--caution);background:#14100A;
      border:1px solid #3A2D12;border-radius:10px;padding:10px var(--s3);margin-top:10px}
.warn div{display:flex;gap:var(--s2)}
.warn div+div{margin-top:5px}
.warn div::before{content:"!";font-weight:700;color:var(--signal);flex:none}
.empty{color:var(--fg-3);font-size:13px;line-height:1.7}

.lcard{border:1px solid var(--line-soft);background:var(--panel);border-radius:12px;
       padding:11px var(--s3);margin-bottom:var(--s2)}
.lcard .lh{display:flex;align-items:center;gap:var(--s2);margin-bottom:6px;flex-wrap:wrap}
.lcard .lh .n{font-size:12px;color:var(--signal-dim);font-variant-numeric:tabular-nums}
.lcard .lh .nm{font-size:13.5px;font-weight:600}
.lcard .lh .opb{font-size:11px;color:var(--signal);border:1px solid var(--signal-edge);
                background:var(--signal-wash);border-radius:6px;padding:2px 7px;white-space:nowrap}
.lcard .lh .btn{margin-left:auto}
.lcard pre{font-family:var(--mono);font-size:12.5px;line-height:1.7;white-space:pre-wrap;
           margin:0;color:var(--fg);background:var(--well);border:1px solid var(--line-soft);
           border-radius:9px;padding:10px 11px}
.lnotes{color:var(--fg-3);font-size:12px;line-height:1.65;border-top:1px solid var(--line-soft);
        margin-top:10px;padding-top:var(--s2)}
.lnotes div{padding-left:13px;text-indent:-13px}
.lnotes div::before{content:"— ";color:var(--signal-dim)}

.check{list-style:none;margin:0;padding:0}
.check li{border-bottom:1px solid var(--line-soft)}
.check li:last-child{border-bottom:none}
.check label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;align-items:start;
             padding:10px 0;font-size:13.5px;line-height:1.55;cursor:pointer}
.check label:hover .txt{color:#fff}
.check li.crit .txt::before{content:"필수";font-size:11px;color:var(--signal);
        border:1px solid var(--signal-edge);background:var(--signal-wash);
        border-radius:6px;padding:1px 6px;margin-right:7px;vertical-align:1px}
.check li.done .txt{text-decoration:line-through;color:var(--fg-3)}
.check input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--signal);cursor:pointer}
.check-meta{color:var(--fg-3);font-size:12px;line-height:1.65;margin-top:var(--s3);
            border-top:1px solid var(--line-soft);padding-top:10px}
.check-meta div+div{margin-top:4px}

.out-bar{display:flex;gap:var(--s3);align-items:center;margin-top:10px;min-height:20px}
.out-bar .muted{margin-left:auto;font-size:11px}
.toast{display:inline-flex;align-items:center;gap:6px;color:var(--fg-3);font-size:12.5px;
       opacity:0;transition:opacity .2s}
.toast svg{width:15px;height:15px}
.toast.on{opacity:1;color:var(--signal)}

/* ---------- 스타일 추천 ---------- */
.llm-grid{display:grid;grid-template-columns:1fr;gap:var(--s3);align-items:start}
.llm-form{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2)}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.keylabel{display:flex;align-items:center;gap:7px;color:var(--fg-2);font-size:12.5px;margin-top:2px}
.keylabel svg{color:var(--signal);width:15px;height:15px}
.flabel{display:block;color:var(--fg-2);font-size:12.5px;margin-bottom:5px}
.info{display:flex;gap:10px;background:var(--panel-2);border:1px solid var(--line-soft);
      border-radius:12px;padding:var(--s3) var(--s4);color:var(--fg-2);font-size:13px;line-height:1.65}
.info svg{width:18px;height:18px;margin-top:2px;color:var(--caution)}
.info p{margin:0}
.llm-note{font-size:13px;line-height:1.6;border-left:2px solid var(--signal);
          padding-left:11px;margin-top:var(--s3);color:var(--fg-2)}
.llm-note .help{color:var(--fg-3);font-size:12px;margin-top:5px}

/* ---------- 프로젝트 ---------- */
.proj-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--s2);align-items:end}
@media(max-width:560px){.proj-row{grid-template-columns:1fr}}
.plist{list-style:none;margin:var(--s3) 0 0;padding:0;max-height:200px;overflow:auto;overscroll-behavior:contain}
.plist li{display:flex;gap:10px;align-items:center;padding:8px 0;
          border-bottom:1px solid var(--line-soft);font-size:13.5px}
.plist li:last-child{border-bottom:none}
.plist li.cur .nm{color:var(--signal);font-weight:600}
.plist li .nm{flex:1;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
              background:none;border:0;color:inherit;font:inherit;text-align:left;padding:4px 0}
.plist li .nm:hover{color:var(--signal)}
.plist li .dt{font-size:11px;color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.plist .empty{white-space:normal}

/* ---------- 악기 선택기 ---------- */
.picker{border:1px solid var(--line-soft);background:var(--well);border-radius:12px;
        padding:var(--s3);margin-top:10px}
.picker-head{display:flex;align-items:center;gap:var(--s3);margin-bottom:10px;flex-wrap:wrap}
.picker-head>span{font-size:13px;font-weight:600;color:var(--fg-2);white-space:nowrap}
.picker-head input{flex:1;min-width:150px;min-height:36px;padding:7px 11px;font-size:13px}
.pk-row{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;
        padding:7px 0;border-top:1px solid var(--line-soft)}
.pk-row[hidden]{display:none}
@media(max-width:560px){.pk-row{grid-template-columns:1fr;gap:5px}}
.pk-lab{font-size:12px;color:var(--fg-3);padding-top:6px}
.pk-opts{display:flex;flex-wrap:wrap;gap:5px;min-width:0}
.pk-foot{display:flex;gap:10px;align-items:center;margin-top:10px;padding-top:10px;
         border-top:1px solid var(--line-soft);flex-wrap:wrap}
.pk-foot pre{flex:1;margin:0;min-width:0;font-family:var(--mono);font-size:12px;line-height:1.6;
             white-space:pre-wrap;word-break:break-word;color:var(--signal);
             background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;padding:10px 11px}
.pk-manual{display:flex;gap:var(--s2);margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft)}
.pk-manual input{flex:1;min-width:0}

/* ---------- 주요 악기 — 채널 카드 ---------- */
.mi-head{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
.mi-count{font-family:var(--mono);font-size:11.5px;color:var(--aux);border:1px solid var(--aux-edge);
          background:var(--aux-wash);border-radius:6px;padding:2px 7px}
.mi-count.over{color:var(--danger);border-color:var(--danger-edge);background:var(--danger-wash)}
.mi-head .btn{margin-left:auto}
.mi-head .btn[hidden]{display:none}
.mi-list{display:flex;flex-direction:column;gap:var(--s2)}
.mi-list .empty{padding:2px 0 4px}
.ch{background:var(--well);border:1px solid var(--line-soft);border-left:2px solid var(--line);
    border-radius:10px;padding:10px var(--s3) var(--s3)}
.ch:has(.rt-all[aria-pressed=true]){border-left-color:var(--aux)}
.ch:has(.rt-sec[aria-pressed=true]){border-left-color:var(--signal)}
.ch.out{border-left-color:var(--danger)}
.ch-top{display:flex;align-items:center;gap:var(--s2);min-width:0}
.ch-no{font-family:var(--mono);font-size:10.5px;color:var(--fg-3);background:var(--panel-2);
       border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;flex:none}
.ch-name{font-size:14px;font-weight:600;white-space:nowrap}
.ch-en{font-family:var(--mono);font-size:11.5px;color:var(--fg-3);min-width:0;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-del{margin-left:auto;background:transparent;border:1px solid transparent;color:var(--fg-3);
        width:36px;height:36px;border-radius:8px;display:grid;place-items:center;padding:0;flex:none;
        transition:border-color .15s,color .15s}
.ch-del svg{width:16px;height:16px}
.ch-del:hover{border-color:var(--danger-edge);color:var(--danger)}
@media(pointer:coarse){.ch-del{width:44px;height:44px;margin-right:-8px}}
.ch-route{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;
          padding-top:10px;border-top:1px solid var(--line-soft)}
.rt{display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--panel);
    border:1px solid var(--line);color:var(--fg-2);border-radius:8px;padding:6px 4px;min-height:44px;
    font-size:13px;font-weight:500;transition:border-color .15s,color .15s,background-color .15s}
.rt small{font-family:var(--mono);font-size:10px;color:var(--fg-3);letter-spacing:.02em}
.rt:hover{color:var(--fg);border-color:var(--fg-3)}
.rt-all[aria-pressed=true]{color:var(--aux);border-color:var(--aux-edge);background:var(--aux-wash)}
.rt-sec[aria-pressed=true]{color:var(--signal);border-color:var(--signal-edge);background:var(--signal-wash)}
.rt-out[aria-pressed=true]{color:var(--danger);border-color:var(--danger-edge);background:var(--danger-wash)}
.rt[aria-pressed=true] small{color:inherit;opacity:.8}
.ch-opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-top:6px}
.ch-opts select{min-height:40px;font-size:13px;padding:7px 32px 7px 10px}
.ch-out,.rg-out{display:flex;flex-direction:column;gap:3px;margin-top:var(--s2);font-size:11.5px;color:var(--fg-3)}
.ch-out code,.rg-out code{font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--aux);
        background:var(--panel);border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px;
        word-break:break-word}
.ch.out .ch-out code{color:var(--danger)}
.ch:has(.rt-sec[aria-pressed=true]) .ch-out code{color:var(--signal)}

/* ---------- 음역 — 저음·고음 4칸 ---------- */
.rg{display:flex;flex-direction:column;gap:var(--s2)}
.rg-row{background:var(--well);border:1px solid var(--line-soft);border-radius:10px;padding:var(--s2)}
.rg-lab{font-size:12px;color:var(--fg-3);margin:0 0 6px 2px}
.rg-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.rg-b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center;
      background:var(--panel);border:1px solid var(--line);color:var(--fg-2);border-radius:8px;
      padding:7px 3px;min-height:52px;transition:border-color .15s,color .15s,background-color .15s}
.rg-b b{font-size:13px;font-weight:600;line-height:1.3}
.rg-b small{font-size:11px;color:var(--fg-3);line-height:1.3}
.rg-b:hover{border-color:var(--fg-3);color:var(--fg)}
.rg-b[aria-pressed=true]{color:var(--aux);border-color:var(--aux-edge);background:var(--aux-wash)}
.rg-b[aria-pressed=true] small{color:var(--aux);opacity:.8}
@media(max-width:380px){.rg-b b{font-size:12px}.rg-b small{font-size:10.5px}}

.pk-prev{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.pk-where{font-size:11.5px;color:var(--fg-3)}
.picker[hidden]{display:none}
.pk-foot pre{color:var(--aux)}

/* ---------- 모바일 하단: 실행 바 + 4탭 내비 ---------- */
.dock{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
  background:rgba(8,8,8,.95);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);will-change:transform;
  backdrop-filter:saturate(140%) blur(10px);-webkit-backdrop-filter:saturate(140%) blur(10px);
}
@media(max-width:1100px){.dock{display:block}}
.hud{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:var(--s2);
     padding:8px var(--s3);border-bottom:1px solid var(--line-soft)}
.hud-meter{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.hud-stat{font-size:11.5px;color:var(--fg-3);font-variant-numeric:tabular-nums;white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
.hud-stat b{color:var(--fg);font-weight:600;font-family:var(--mono);font-size:11.5px}
.hud-stat .sep{display:inline-block;width:1px;height:9px;background:var(--line);margin:0 6px;vertical-align:-1px}
@media(max-width:380px){.hud-stat .ly-n{display:none}}
.btn.go,.bn{-webkit-tap-highlight-color:transparent}
.vu{display:flex;gap:2px;width:100%;max-width:150px}
.vu i{flex:1;height:5px;border-radius:1px;background:var(--line-soft)}
.vu i.on{background:var(--aux)}
.vu i.hot{background:var(--caution)}
.vu i.over{background:var(--danger)}
.btn.go{flex:none;min-height:44px;padding:0 12px;gap:6px;background:var(--signal);border-color:var(--signal);
        color:#1A0C00;font-weight:700;font-size:13.5px}
.btn.go svg{color:#1A0C00;width:17px;height:17px}
.btn.go:hover{background:#FF9A3C;color:#1A0C00;border-color:#FF9A3C}
.btn.go:active{transform:translateY(1px)}
.btn.go.done{background:var(--aux);border-color:var(--aux)}
#dockLyrics{background:var(--caution);border-color:var(--caution)}
#dockLyrics.done{background:var(--aux);border-color:var(--aux)}
.dock.kb .bnav{display:none}
.dock.kb{padding-bottom:0}
.bnav{display:none}
.dock.kb{padding-bottom:0}
.bnav{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px var(--s2)}
.bn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:transparent;border:1px solid transparent;border-radius:10px;color:var(--fg-3);
    font-size:11.5px;font-weight:500;min-height:48px;padding:4px 0;
    transition:color .15s,background-color .15s,border-color .15s}
.bn svg{width:21px;height:21px}
.bn:hover{color:var(--fg)}
.bn:active{transform:scale(.97)}
.bn[aria-current=true]{color:var(--signal);background:var(--signal-wash);border-color:var(--signal-edge)}

/* ---------- 푸터 ---------- */
.foot{margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line-soft);text-align:center}
.foot-brand{display:inline-flex;align-items:center;gap:7px;color:var(--fg-3);font-size:13px;margin-bottom:7px}
.foot-brand svg{width:16px;height:16px;color:var(--signal-dim)}
.foot .muted{font-size:11.5px;max-width:680px;margin:0 auto;line-height:1.7}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>

    </div>
  </div>
  <div class="top-r">
    <span class="badge" id="modelBadge">V6</span>
    <a class="gear" href="#llmPanel" aria-label="스타일 추천 설정"><svg aria-hidden="true"><use href="#i-gear"/></svg></a>
  </div>
</header>

<div class="cols">

    <section class="card control">
      <div class="toolbar">
        <div class="stamp">
          <span class="tag" id="stampMode">ONE-SHOT</span>
          <span class="name" id="stampName">TAKE 01</span>
        </div>
        <div class="actions">
          <button type="button" class="btn" id="newBtn"><svg aria-hidden="true"><use href="#i-note"/></svg>새 곡</button>
          <button type="button" class="btn" id="saveBtn"><svg aria-hidden="true"><use href="#i-save"/></svg>저장</button>
          <button type="button" class="btn" id="resetBtn"><svg aria-hidden="true"><use href="#i-refresh"/></svg>입력 초기화</button>
        </div>
      </div>
      <div class="seg" role="group" aria-label="생성 경로">
        <button type="button" class="seg-item" id="modeOneshot" aria-pressed="true">
          <svg aria-hidden="true"><use href="#i-oneshot"/></svg>
          <span><b>ONE-SHOT</b><small>완곡을 여러 번 뽑아 베스트를 고릅니다</small></span>
        </button>
        <button type="button" class="seg-item" id="modeSplit" aria-pressed="false">
          <svg aria-hidden="true"><use href="#i-layers"/></svg>
          <span><b>SPLIT</b><small>완곡에서 스템을 뽑아 파트를 고칩니다</small></span>
        </button>
      </div>

<script>
/* =====================================================================
   SUNO PROMPT GENERATOR — RULES LAYER (2층)
   ---------------------------------------------------------------------
   순수 함수. DOM을 모른다. window.SUNO_DATA 또는 인자로 받은 data를 읽는다.
   UI를 갈아엎어도 그대로 남고, 서버/네이티브로 통째 이식 가능.
   ===================================================================== */
(function (root) {
  "use strict";

  const D = () => (typeof root.SUNO_DATA !== "undefined" ? root.SUNO_DATA : null);

  /* ---------- 유틸 ---------- */
  const has = v => v !== undefined && v !== null && String(v).trim() !== "" && v !== "none";
  const trim = v => (v == null ? "" : String(v).trim());
  const find = (list, id) => (list || []).find(x => x.id === id) || null;
  const dedup = arr => { const s = new Set(); return arr.filter(x => { const k = x.toLowerCase(); if (s.has(k)) return false; s.add(k); return true; }); };
  const fill = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, k) => (vars[k] ?? ""));

  /* ---------- 기본 state ---------- */
  function defaultState() {
    return {
      mode: "oneshot",              // "oneshot" | "split"
      model: "v6",                  // "v6" | "v6-wild" | "v6-mini"
      explore: false,               // 탐색 모드 (Variety 개방)
      title: "", theme: "", usage: "song", length: "3분",
      genre1: "citypop", genre2: "", blend: "lead",
      bpm: "", rangeLow: "L2", rangeHigh: "H2", intensity: "none", mood: "none",
      gender: "female", age: "adult", range: "", tone: "honest", mic: "close",
      lang: "ko", structure: "poprock", introCheat: "none",
      splitTargets: [],             // Advanced Split으로 뽑을 스템 id 배열
      layers: [],                   // 스템 작업 [{id, ko, op, prompt, detail}]
      userExclude: "",
      lyrics: "",
      styleLang: "en",
      useRef: "none",               // "none" | "sampleLead" | "tagLead"
      mainInst: [],                 // 주요 악기 [{ko,en,a,artic,range,intent:'in'|'out'}]
      extraStyle: [],               // LLM 제안 디스크립터 (사용자가 수락한 것)
      sectionOverrides: {}          // LLM 제안 섹션 디렉팅 {tag: text}
    };
  }

  /* ---------- 장르 ---------- */
  function genreName(id, data) {
    const g = find(data.genres, id);
    if (g) return g.en;
    return trim(id); // 자유 입력
  }
  function genrePhrase(state, data) {
    const g1 = genreName(state.genre1, data), g2 = genreName(state.genre2, data);
    if (!g1 && !g2) return "";
    if (g1 && g2) {
      const b = find(data.genreBlend, state.blend) || data.genreBlend[0];
      return fill(b.pattern, { g1, g2 });
    }
    return g1 || g2;
  }

  /* ---------- 보컬 ---------- */
  function vocalPhrase(state, data) {
    const gender = find(data.vocal.gender, state.gender);
    if (!gender || !gender.en) return "";
    const age = find(data.vocal.age, state.age);
    const parts = [];
    if (age && age.en) parts.push(age.en);
    parts.push(gender.en);
    let s = parts.join(" ");
    const tone = find(data.vocal.tone, state.tone);
    if (tone && tone.en) s += ", " + tone.en;
    if (has(state.range)) s += ", " + trim(state.range);
    return s;
  }
  function vocalToggle(state, data) {
    const g = find(data.vocal.gender, state.gender);
    return g ? g.toggle : null;
  }


  /* ---------- 보컬 음역 ---------- */
  function isWideRange(state) {
    return ["L3","L4"].includes(state.rangeLow) && ["H3","H4"].includes(state.rangeHigh);
  }
  function rangePhrase(state, data) {
    const V = data.vocalRange;
    const lo = find(V.low, state.rangeLow), hi = find(V.high, state.rangeHigh);
    if (!lo || !hi || state.gender === "none") return "";
    const g = state.gender === "male" || state.gender === "mduet" ? "male"
            : state.gender === "female" || state.gender === "fduet" ? "female" : "neutral";
    const parts = [lo[g] || lo.neutral, hi.en];
    if (hi.quiet) parts.push(V.quietMarkers.join(", "));
    if (isWideRange(state)) parts.unshift("wide vocal range");
    return parts.filter(Boolean).join(", ");
  }
  function rangeWarnings(state, data, styleText) {
    const V = data.vocalRange, out = [];
    const hi = find(V.high, state.rangeHigh);
    if (state.rangeLow === "L4" && state.rangeHigh === "H4") out.push(V.warnings.wide);
    if (state.rangeHigh === "H4") out.push(V.warnings.whistle);
    if (hi && hi.quiet) {
      const hit = V.energyWords.filter(w => styleText.toLowerCase().includes(w.toLowerCase()));
      if (hit.length) out.push(V.warnings.quietConflict + " (" + hit.join(", ") + ")");
    }
    return out;
  }


  /* ---------- 주요 악기 ----------
     구간 = 곡 전체  + 넣기 → Style 박스 (장르 기본 악기를 대체)
     구간 = 특정 구간 + 넣기 → 가사창 해당 섹션 태그
     빼기 + 곡 전체 → Exclude 칸 + 모든 섹션 태그 ("no X")
     빼기 + 특정 구간 → 해당 섹션 태그 ("X out" — 편곡 표기 관례)
     Style 박스에는 부정어를 넣지 않는다 (v6에서도 '포함'으로 읽힘) */
  const RANGE_TAGS = { chorus: ["Chorus", "Final Chorus", "Hook"], verse: ["Verse"], bridge: ["Bridge"],
                       final: ["Final Chorus"], intro: ["Intro"], outro: ["Outro"] };
  const MAIN_INST_MAX = 4;

  function instPhrase(sel, INS) {
    INS = INS || root.SUNO_INSTRUMENTS;
    if (!sel || !sel.en) return "";
    const art = INS ? (INS.artic[sel.a] || []).find(a => a.id === sel.artic) : null;
    let core = trim(sel.en);
    if (art && art.pos === "pre") core = art.en + " " + core;
    if (art && art.pos === "post") core += " " + art.en;
    return core.replace(/\s+/g, " ").trim();
  }
  function mainInstPlace(sel) {
    const out = sel.intent === "out", all = sel.range === "all";
    if (out && all) return "exclude";
    if (all) return "style";
    return "section";
  }
  function mainInstPreview(sel, INS) {
    INS = INS || root.SUNO_INSTRUMENTS;
    const rng = INS ? (INS.range || []).find(r => r.id === sel.range) : null;
    const where = mainInstPlace(sel);
    if (where === "style") return { where: "Style 박스", text: instPhrase(sel, INS) };
    if (where === "exclude") return { where: "Exclude 칸 + 모든 섹션 태그", text: `${sel.en}  /  [Verse: no ${sel.en}] …` };
    const label = rng ? rng.ko : "";
    const cue = sel.intent === "out" ? `${sel.en} out` : instPhrase(sel, INS);
    return { where: `가사창 섹션 태그 (${label})`, text: cue };
  }
  function sectionCues(key, afterV2, state) {
    const INS = root.SUNO_INSTRUMENTS, cues = [];
    (state.mainInst || []).forEach(m => {
      let hit = false;
      if (m.range === "all") hit = m.intent === "out";
      else if (m.range === "v2") hit = afterV2;
      else hit = (RANGE_TAGS[m.range] || []).includes(key);
      if (!hit) return;
      if (m.intent === "out") cues.push(m.range === "all" ? `no ${m.en}` : `${m.en} out`);
      else cues.push(instPhrase(m, INS));
    });
    return cues;
  }
  function joinDir(base, cues) {
    return dedup([base, ...cues].join(", ").split(",").map(trim).filter(Boolean)).join(", ");
  }
  function mainInstWarnings(state, data) {
    const w = [], mi = state.mainInst || [];
    const core = mi.filter(m => m.intent !== "out" && m.range === "all");
    if (core.length > MAIN_INST_MAX) w.push(`곡 전체 주요 악기 ${core.length}개. 핵심 악기는 3~5개가 한계 — 넘치면 편곡이 혼잡해지고 서로 묻힌다. ${MAIN_INST_MAX}개 이하로 줄일 것.`);
    // 같은 악기를 넣고 빼는데 구간이 겹칠 때만 경고 (인트로 빼기 + 2절부터 넣기 같은 건 정상)
    const overlap = (a, b) => a === "all" || b === "all" || a === b;
    const clash = mi.filter(o => o.intent === "out" && mi.some(i => i.intent !== "out" &&
      i.en.toLowerCase() === o.en.toLowerCase() && overlap(i.range, o.range))).map(m => m.ko);
    if (clash.length) w.push(`같은 악기를 같은 구간에서 넣기와 빼기로 동시에 지정했다: ${[...new Set(clash)].join(", ")}. 하나만 남길 것.`);
    const outAll = mi.filter(m => m.intent === "out" && m.range === "all");
    const genre = find(data.genres, state.genre1);
    if (outAll.length && genre && !core.length) {
      const hit = outAll.filter(m => genre.oneShotTags.join(" ").toLowerCase().includes(m.en.split(" ").pop().toLowerCase()));
      if (hit.length) w.push(`장르 기본 악기에 '${hit.map(m => m.ko).join(", ")}'가 들어 있는데 빼기로 지정했다. 곡 전체 주요 악기를 직접 골라 기본 악기를 대체하면 충돌이 사라진다.`);
    }
    return w;
  }

  /* ---------- 익스클루드 ---------- */
  function normalizeExcludeItem(raw, data) {
    let s = trim(raw).toLowerCase();
    if (!s) return "";
    // 부정어 제거
    for (const p of data.excludeRules.negationPrefixes) {
      const pl = p.toLowerCase();
      if (s.startsWith(pl)) s = s.slice(pl.length).trim();
      if (s.endsWith(pl.trim())) s = s.slice(0, s.length - pl.trim().length).trim();
    }
    s = s.replace(/^-+/, "").trim();
    // 동의어 정규화
    const n = data.excludeRules.normalize;
    if (n[s]) s = n[s];
    return s;
  }
  function buildExclude(baseList, userText, data, baseFirst) {
    const warnings = [];
    const user = trim(userText).split(/[,\n]/).map(x => normalizeExcludeItem(x, data)).filter(Boolean);
    const base = (baseList || []).map(x => normalizeExcludeItem(x, data)).filter(Boolean);
    const merged = dedup(baseFirst ? [...base, ...user] : [...user, ...base]);
    if (merged.length <= data.excludeRules.maxCount) return { list: merged, warnings };
    // 우선순위대로 자르기: 사용자 항목은 먼저 보존, 나머지는 priority 순
    const pri = data.excludeRules.priority;
    const rank = x => { const i = pri.indexOf(x); return i < 0 ? 999 : i; };
    const userSet = new Set(baseFirst ? base : user);
    const sorted = [...merged].sort((a, b) => {
      const ua = userSet.has(a) ? 0 : 1, ub = userSet.has(b) ? 0 : 1;
      if (ua !== ub) return ua - ub;
      return rank(a) - rank(b);
    });
    const kept = sorted.slice(0, data.excludeRules.maxCount);
    const dropped = sorted.slice(data.excludeRules.maxCount);
    warnings.push(`익스클루드 ${merged.length}개 → ${data.excludeRules.maxCount}개로 잘림. 제외됨: ${dropped.join(", ")}. (5개 초과 시 모델이 제외를 포기함)`);
    return { list: kept, warnings };
  }

  /* ---------- 슬라이더 ---------- */
  function sliderFor(state, data) {
    if (state.useRef === "sampleLead") return data.sliders.refSampleLead;
    if (state.useRef === "tagLead") return data.sliders.refTagLead;
    if (state.explore) return data.sliders.explore;
    return data.sliders[state.mode] || data.sliders.oneshot;
  }
  function fmtRange(r) { return r ? `${r[0]}~${r[1]}` : "—"; }

  /* ---------- BASE 프롬프트 ---------- */
  function buildBasePrompt(state, data) {
    data = data || D();
    const warnings = [];
    const parts = [];
    const mode = state.mode === "split" ? "split" : "oneshot";
    const lang = find(data.languages, state.lang);
    const mic = find(data.micDistance, state.mic);
    const mood = find(data.mood, state.mood);
    const inten = find(data.intensity, state.intensity);
    const usage = find(data.usage, state.usage);
    const genre = find(data.genres, state.genre1);
    const bpm = has(state.bpm) ? trim(state.bpm) : (genre ? String(genre.defaultBpm) : "");
    let excludeBase = [];

    // 완곡 프롬프트 (원샷·스플릿 공통 — 스플릿도 완곡부터 뽑는다)
    parts.push(genrePhrase(state, data));
    if (mood && mood.en) parts.push(mood.en);
    if (inten && inten.en) parts.push(inten.en);
    const coreIns = (state.mainInst || []).filter(m => m.intent !== "out" && m.range === "all");
    if (coreIns.length) parts.push(coreIns.map(m => instPhrase(m)).join(", "));
    else if (genre) parts.push(genre.oneShotTags.join(", "));
    parts.push(vocalPhrase(state, data));
    parts.push(rangePhrase(state, data));
    if (mic && mic.en) parts.push(mic.en);
    const ic = find(data.introCheats, state.introCheat);
    if (ic && ic.en) parts.push(ic.en);
    (state.extraStyle || []).forEach(x => parts.push(x));
    if (bpm) parts.push(`${bpm} BPM`);
    if (lang && lang.en && state.gender !== "none") parts.push(lang.en);
    if (usage && usage.en) parts.push(usage.en);
    if (state.gender === "none") { parts.unshift("instrumental, no vocals"); excludeBase = ["vocals","singing","humming"]; }

    const style = dedup(parts.map(trim).filter(Boolean).join(", ").split(",").map(trim).filter(Boolean)).join(", ");
    const outAll = (state.mainInst || []).filter(m => m.intent === "out" && m.range === "all").map(m => m.en);
    const userEx = [outAll.join(", "), trim(state.userExclude)].filter(Boolean).join(", ");
    const ex = buildExclude(excludeBase, userEx, data, false);
    warnings.push(...mainInstWarnings(state, data));
    warnings.push(...ex.warnings);

    // 디스크립터 개수 점검
    warnings.push(...rangeWarnings(state, data, style));
    const count = parts.map(trim).filter(x => x && !/\bBPM\b|^singing in|^no /i.test(x)).length;
    const lim = data.limits.descriptors[mode];
    if (count > lim.max) warnings.push(`디스크립터 ${count}개. ${mode === "stem" ? "베이스 트랙" : "통짜"} 권장 ${lim.min}~${lim.max}개. 너무 많으면 충돌한다.`);
    if (style.length > data.limits.styleChars) warnings.push(`Style ${style.length}자. 한도 ${data.limits.styleChars}자 — 초과분은 경고 없이 잘린다.`);

    if (state.model === "v6-wild") warnings.push("v6-wild는 결과 편차가 크다. 발매용이면 v6로 두는 것이 안전하다.");
    if (state.model === "v6-mini") warnings.push("v6-mini는 무료 플랜 포함 모델. 무료 플랜 출력에는 상업권이 없다.");
    const sl = sliderFor(state, data);
    if (sl.audioInfluence && sl.styleInfluence && (sl.audioInfluence[1] + sl.styleInfluence[1]) >= 150)
      warnings.push("Style Influence + Audio Influence 합이 과도. 둘 다 높이면 결과가 붕괴한다.");

    return {
      style,
      styleChars: style.length,
      exclude: ex.list,
      sliders: { weirdness: fmtRange(sl.weirdness), styleInfluence: fmtRange(sl.styleInfluence), variety: sl.variety || "0 (고정)", audioInfluence: fmtRange(sl.audioInfluence) },
      model: (data.models.find(m => m.id === state.model) || data.models[0]),
      vocalGender: vocalToggle(state, data),
      warnings
    };
  }

  /* ---------- 가사 ---------- */
  const HANGUL = /[\uAC00-\uD7A3]/g;
  const LATIN  = /[A-Za-z]/;
  const DIGIT  = /[0-9]/;

  function countSyllables(line, lang) {
    const clean = line.replace(/\[[^\]]*\]/g, "").replace(/\([^)]*\)/g, "");
    if (lang === "ko") return (clean.match(HANGUL) || []).length;
    if (lang === "ja") return (clean.match(/[\u3040-\u30FF\u4E00-\u9FFF]/g) || []).length;
    // 영어: 모음 덩어리 근사
    return (clean.toLowerCase().match(/[aeiouy]+/g) || []).length;
  }

  function validateLyrics(text, lang, data) {
    data = data || D();
    const warnings = [];
    const lines = trim(text).split("\n");
    const kr = data.koreanRules.syllablesPerLine;
    lines.forEach((line, i) => {
      const t = trim(line);
      if (!t) return;
      const isTag = /^\[.*\]$/.test(t);
      if (isTag) return;
      const n = i + 1;
      const syl = countSyllables(t, lang);
      if (lang === "ko") {
        if (syl > kr.max) warnings.push(`${n}행: ${syl}음절. 한국어는 8~10음절 권장(최대 12). 줄을 나누거나 쉼표로 호흡을 끊을 것.`);
        if (LATIN.test(t.replace(/\([^)]*\)/g, ""))) warnings.push(`${n}행: 로마자 혼입. 순수 한글로 쓸 것 (로마자 병기는 최후수단).`);
      }
      if (DIGIT.test(t)) warnings.push(`${n}행: 아라비아 숫자. 한글/문자로 풀어 쓸 것 (1234 → 천이백삼십사).`);
      // 소괄호 안 지시어
      const parens = t.match(/\(([^)]*)\)/g) || [];
      parens.forEach(p => {
        const inner = p.slice(1, -1).toLowerCase();
        if (data.directiveWords.some(w => inner.includes(w.toLowerCase())))
          warnings.push(`${n}행: 소괄호 ${p} 안에 지시어. 소괄호는 실제로 부를 소리만. 지시는 [${p.slice(1,-1)}] 처럼 대괄호로.`);
      });
    });
    return warnings;
  }

  function sectionBase(tag) {
    // "Verse 1" → "Verse", "Final Chorus" 그대로
    if (/^Final Chorus/i.test(tag)) return "Final Chorus";
    if (/^Verse/i.test(tag)) return "Verse";
    if (/^Chorus/i.test(tag)) return "Chorus";
    if (/^Pre-Chorus/i.test(tag)) return "Pre-Chorus";
    return tag;
  }

  function directFor(tag, state, data) {
    const table = data.sectionDirecting[state.mode] || data.sectionDirecting.oneshot;
    const key = sectionBase(tag);
    const tpl = table[key] !== undefined ? table[key] : table._default;
    let out = trim(tpl);
    if (isWideRange(state)) {
      const L = data.vocalRange.ladder;
      if (key === "Verse") out = out ? out + ", " + L.verse : L.verse;
      if (key === "Chorus" || key === "Final Chorus") out = out ? out + ", " + L.chorus : L.chorus;
    }
    return dedup(out.split(",").map(trim).filter(Boolean)).join(", ");
  }

  function syllableTemplate(state, data) {
    const st = find(data.structures, state.structure) || data.structures[0];
    const ideal = data.koreanRules.syllablesPerLine.ideal;
    const out = [];
    let verses = 0;
    st.sections.forEach(sec => {
      const key = sectionBase(sec.tag);
      if (key === "Verse") verses++;
      const base = (state.sectionOverrides || {})[sec.tag] || directFor(sec.tag, state, data);
      const dir = joinDir(base, sectionCues(key, verses >= 2, state));
      out.push(dir ? `[${sec.tag}: ${dir}]` : `[${sec.tag}]`);
      for (let i = 0; i < sec.lines; i++) {
        const n = ideal[i % 2];                       // 8, 10 번갈아
        const half = Math.ceil(n / 2);
        out.push("ㅇ".repeat(half) + ", " + "ㅇ".repeat(n - half) + ".");
      }
      out.push("");
    });
    return out.join("\n").trim();
  }

  function decorateLyrics(text, state, data) {
    let verses = 0;
    return trim(text).split("\n").map(line => {
      const m = line.match(/^\[([^\]:]+)(?::([^\]]*))?\]$/);
      if (!m) return line;
      const tag = trim(m[1]), userDir = trim(m[2] || "");
      const key = sectionBase(tag);
      if (key === "Verse") verses++;
      const autoDir = directFor(tag, state, data);
      const ov = (state.sectionOverrides || {})[tag] || "";
      const dir = joinDir(userDir || ov || autoDir, sectionCues(key, verses >= 2, state));
      return dir ? `[${tag}: ${dir}]` : `[${tag}]`;
    }).join("\n");
  }

  function buildLyrics(state, data) {
    data = data || D();
    const empty = !has(state.lyrics);
    const text = empty ? syllableTemplate(state, data) : decorateLyrics(state.lyrics, state, data);
    const warnings = empty ? ["가사 미입력. ㅇ 자리에 맞춰 작사하면 섹션별 보컬 디렉팅이 자동으로 붙는다."] : validateLyrics(state.lyrics, state.lang, data);
    if (isWideRange(state)) warnings.push(data.vocalRange.ladder.note);
    if ((state.mainInst || []).some(m => m.range === "final") && !/\[Final Chorus/i.test(text))
      warnings.push("'마지막 코러스'로 지정한 악기가 들어갈 [Final Chorus] 태그가 없다. 마지막 [Chorus]를 [Final Chorus]로 바꿔 쓰거나 곡 구성을 발라드·K-pop으로 고를 것.");
    if ((state.mainInst || []).some(m => m.range === "intro") && !/\[Intro/i.test(text))
      warnings.push("'인트로에만'으로 지정한 악기가 들어갈 [Intro] 태그가 없다.");
    if (text.length > data.limits.lyricsPracticalChars) warnings.push(`가사 ${text.length}자. 약 ${data.limits.lyricsPracticalChars}자 넘으면 서두르거나 건너뛴다.`);
    return { text, chars: text.length, isTemplate: empty, warnings };
  }


  /* ---------- 악기 선택기 → 영문 문장 ---------- */
  function composeInstrument(sel, INS) {
    INS = INS || root.SUNO_INSTRUMENTS;
    if (!INS || !sel || !sel.en) return "";
    const art = (INS.artic[sel.articType] || []).find(a => a.id === sel.artic);
    const rng = (INS.range || []).find(r => r.id === sel.range);
    let core = trim(sel.en);
    if (art && art.pos === "pre") core = art.en + " " + core;
    let s = "Add " + core;
    if (art && art.pos === "post") s += " " + art.en;
    if (rng && rng.en) s += " " + rng.en;
    return s.replace(/\s+/g, " ").trim();
  }

  /* ---------- 레이어 ---------- */
  function suggestLayers(genreId, data) {
    data = data || D();
    const g = find(data.genres, genreId);
    if (!g) return [];
    return g.layers.map(l => ({ id: l.id, ko: l.ko, prompt: l.prompt, detail: "" }));
  }

  function buildLayers(state, data) {
    data = data || D();
    if (state.mode !== "split") return [];
    const genre = find(data.genres, state.genre1);
    const bpm = has(state.bpm) ? trim(state.bpm) : (genre ? String(genre.defaultBpm) : "");
    const R = data.layerRules;
    return (state.layers || []).map((l, i) => {
      const warnings = [];
      const op = find(data.stemOps, l.op) || data.stemOps[0];
      const nameBlob = (l.ko + " " + (l.prompt || "") + " " + (l.detail || "")).toLowerCase();
      if (op.id === "add" && R.harmonyKeywords.some(k => nameBlob.includes(k.toLowerCase()))) warnings.push(R.harmonyWarning);

      let prompt;
      if (op.id === "remove") {
        prompt = `(Chat Bar 불필요) Advanced Split으로 ${l.ko} 스템을 분리한 뒤 뮤트. 재생성하지 않으므로 크레딧은 분리분만 소모된다.`;
      } else {
        const body = trim(l.prompt) || `Add ${l.ko}`;
        const core = body.replace(/^Add /, "");
        const verb = op.id === "regen" ? "Regenerate this part as" : op.id === "replace" ? "Replace this part with" : "Add";
        const detail = has(l.detail) ? " " + trim(l.detail).replace(/\.?$/, ".") : "";
        const tech = bpm ? ` ${bpm} BPM.` : "";
        prompt = `${verb} ${core}.${detail} ${R.detailRelation}${tech}`.replace(/\s+/g, " ").trim();
      }
      return { order: i + 1, id: l.id, name: l.ko, op: op.ko, opId: op.id, opNote: op.note, prompt, notes: R.postNotes, warnings };
    });
  }

  /* ---------- Advanced Split 지정 목록 ---------- */
  function buildSplitPlan(state, data) {
    data = data || D();
    if (state.mode !== "split") return null;
    const picked = (state.splitTargets || []).map(id => find(data.stemTargets, id)).filter(Boolean);
    const weak = picked.filter(x => x.quality === "weak");
    return {
      list: picked.map(x => x.en),
      ko: picked.map(x => x.ko),
      credits: picked.length * 10,
      weak: weak.map(x => x.ko),
      warnings: [
        picked.length === 0 ? "분리할 스템을 하나도 고르지 않았다." : "",
        picked.length > 5 ? "스템이 많을수록 아티팩트·크로스토크가 늘어난다. 필요한 것만 고를 것." : "",
        weak.length ? `품질이 약한 스템: ${weak.map(x => x.ko).join(", ")}. baked-in 이펙트에 잠기거나 힘이 빠질 수 있으니 DAW 재작업 대안을 준비할 것.` : ""
      ].filter(Boolean)
    };
  }

  /* ---------- 체크리스트 ---------- */
  function buildChecklist(state, data) {
    data = data || D();
    const mode = state.mode === "split" ? "split" : "oneshot";
    return {
      items: data.checklist[mode].map(x => ({ ...x })),
      credits: data.checklist.credits,
      v6: data.checklist.v6,
      korean: data.checklist.korean,
      route: data.checklist.route,
      downloadCap: data.checklist.downloadCap,
      excludeVerify: data.excludeRules.howToVerify,
      sliderDebug: data.sliders.debug
    };
  }

  /* ---------- 전체 빌드 ---------- */
  function buildAll(state, data) {
    data = data || D();
    return {
      base: buildBasePrompt(state, data),
      lyrics: buildLyrics(state, data),
      layers: buildLayers(state, data),
      split: buildSplitPlan(state, data),
      check: buildChecklist(state, data)
    };
  }

  root.SUNO_RULES = { instPhrase, mainInstPreview, mainInstPlace, composeInstrument, rangePhrase, isWideRange, buildSplitPlan, defaultState, buildAll, buildBasePrompt, buildLyrics, buildLayers, buildChecklist, validateLyrics, suggestLayers, countSyllables, genrePhrase };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* =====================================================================
   SUNO PROMPT GENERATOR — STORAGE LAYER (2층)
   ---------------------------------------------------------------------
   로직과 UI는 이 인터페이스만 안다. 구현체(localStorage)는 모른다.
   2단계에서 Supabase 등으로 갈아끼울 때 이 파일의 impl만 교체한다.
   API 키는 절대 동기화 대상에 넣지 않는다 (별도 키 공간).
   ===================================================================== */
(function (root) {
  "use strict";

  const NS = "suno-gen:";
  const K = { projects: NS + "projects", current: NS + "current", keys: NS + "apikeys", check: NS + "check:" };

  const hasLS = (() => { try { const t = "__t"; localStorage.setItem(t, t); localStorage.removeItem(t); return true; } catch { return false; } })();
  const mem = {};
  const get = k => { if (hasLS) { const v = localStorage.getItem(k); return v == null ? null : JSON.parse(v); } return mem[k] ?? null; };
  const set = (k, v) => { if (hasLS) localStorage.setItem(k, JSON.stringify(v)); else mem[k] = v; };
  const del = k => { if (hasLS) localStorage.removeItem(k); else delete mem[k]; };

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  /* ---------- 프로젝트 ---------- */
  const Storage = {
    persistent: hasLS,

    async list() {
      return (get(K.projects) || []).map(p => ({ id: p.id, name: p.name, updatedAt: p.updatedAt, mode: p.state && p.state.mode }));
    },
    async load(id) {
      return (get(K.projects) || []).find(p => p.id === id) || null;
    },
    async save(project) {
      const all = get(K.projects) || [];
      const now = new Date().toISOString();
      if (!project.id) project.id = uid();
      project.updatedAt = now;
      const i = all.findIndex(p => p.id === project.id);
      if (i >= 0) all[i] = project; else all.unshift(project);
      set(K.projects, all);
      set(K.current, project.id);
      return { id: project.id };
    },
    async remove(id) {
      set(K.projects, (get(K.projects) || []).filter(p => p.id !== id));
      del(K.check + id);
      if (get(K.current) === id) del(K.current);
    },
    async currentId() { return get(K.current); },
    async setCurrent(id) { set(K.current, id); },

    async exportAll() {
      return JSON.stringify({ app: "suno-prompt-generator", version: 1, exportedAt: new Date().toISOString(), projects: get(K.projects) || [] }, null, 2);
    },
    async importAll(json, merge) {
      const data = typeof json === "string" ? JSON.parse(json) : json;
      if (!data || !Array.isArray(data.projects)) throw new Error("가져올 수 없는 파일. suno-prompt-generator 내보내기 파일이 아님.");
      const incoming = data.projects.filter(p => p && p.id && p.state);
      if (merge) {
        const all = get(K.projects) || [];
        incoming.forEach(p => { const i = all.findIndex(x => x.id === p.id); if (i >= 0) all[i] = p; else all.push(p); });
        set(K.projects, all);
      } else set(K.projects, incoming);
      return incoming.length;
    },

    /* 체크리스트 진행 상황 (프로젝트별) */
    async loadCheck(id) { return get(K.check + (id || "draft")) || {}; },
    async saveCheck(id, obj) { set(K.check + (id || "draft"), obj); },

    /* API 키 — 이 기기에만. 동기화 대상 아님. */
    async getKeys() { return get(K.keys) || {}; },
    async setKey(provider, key, model) {
      const all = get(K.keys) || {};
      if (!key) delete all[provider]; else all[provider] = { key, model: model || "" };
      set(K.keys, all);
    },
    async clearKeys() { del(K.keys); }
  };

  /* ---------- 인증 자리 (1단계: 항상 미로그인) ---------- */
  const Auth = {
    async currentUser() { return null; },
    async signIn() { throw new Error("로그인은 아직 지원하지 않음"); },
    async signOut() {}
  };

<script>
/* =====================================================================
   SUNO PROMPT GENERATOR — LLM LAYER (2층, 선택 기능)
   ---------------------------------------------------------------------
   사용자 키로 브라우저에서 직접 호출. 서버 없음. 키는 기기 밖으로 나가지 않는다.
   어댑터 A: OpenAI 규격 (OpenAI, Grok)  /  어댑터 B: Anthropic
   Gemini 제외 (OpenAI 호환 엔드포인트 CORS 문제). 필요 시 OpenRouter를 A 규격으로 추가.
   ===================================================================== */
(function (root) {
  "use strict";

  const PROVIDERS = {
    openai: { name: "OpenAI",  adapter: "A", url: "https://api.openai.com/v1/chat/completions", defaultModel: "gpt-4o-mini" },
    grok:   { name: "Grok (xAI)", adapter: "A", url: "https://api.x.ai/v1/chat/completions", defaultModel: "grok-3-mini" },
    claude: { name: "Claude", adapter: "B", url: "https://api.anthropic.com/v1/messages", defaultModel: "claude-sonnet-4-6" }
  };

  function systemPrompt(data) {
    return [
      "You are a Suno v5.5 prompt engineer. Return ONLY a JSON object, no markdown, no prose.",
      "Rules you must follow (verified, non-negotiable):",
      "- Style descriptors: front-load genre. Do NOT use percentages for genre blending. Avoid contradictory moods.",
      "- Do not write technical mixing terms (sidechain, compression ratio). Suno ignores them in Style.",
      "- Section directing goes inside square brackets after the tag: [Verse 1: whispered, guitar only]. Never put directives inside parentheses — parentheses are sung.",
      "- Never use note names or octave numbers (C3, G4, \"A2 to E5\"). Suno ignores them. Describe range with voice-type and register words only.",
      "- Korean lyrics: keep 8-10 syllables per line, keep commas/periods for breathing, no romanization, no Arabic numerals.",
      "- In STEM mode the base track must stay minimal: ONE accompaniment instrument + vocal. Do not suggest adding instruments to the Style; those go to Studio layers.",
      "- Never suggest AI harmony vocal layering (sync drifts). Backing vocals are regenerated whole.",
      "Output schema: {\"styleAdditions\": [up to 3 short descriptors that sharpen mood/texture, or empty], \"sectionDirecting\": {\"<tag as in lyrics>\": \"<short directing in the lyric language>\"}, \"layerHints\": {\"<layer id>\": \"<one short phrase>\"}, \"note\": \"<one sentence for the producer, in Korean>\"}"
    ].join("\n");
  }

  function userPrompt(state, built, data) {
    const g = (data.genres.find(x => x.id === state.genre1) || {}).en || state.genre1;
    return JSON.stringify({
      mode: state.mode,
      theme: state.theme,
      genre: g, genre2: state.genre2, blend: state.blend,
      bpm: state.bpm, vocalRange: { low: state.rangeLow, high: state.rangeHigh }, mood: state.mood, language: state.lang,
      vocal: { gender: state.gender, tone: state.tone, mic: state.mic },
      mainInstruments: (state.mainInst || []).map(m => ({ name: m.en, articulation: m.artic, range: m.range, intent: m.intent })),
      currentStyle: built.base.style,
      lyrics: state.lyrics ? state.lyrics.slice(0, 2500) : "(none yet)",
      layers: built.layers.map(l => ({ id: l.id, name: l.name }))
    });
  }

  async function callA(p, key, model, sys, usr) {
    const r = await fetch(p.url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
      body: JSON.stringify({ model, temperature: 0.4, messages: [{ role: "system", content: sys }, { role: "user", content: usr }] })
    });
    if (!r.ok) throw new Error(`${p.name} ${r.status}: ${(await r.text()).slice(0, 200)}`);
    const j = await r.json();
    return j.choices?.[0]?.message?.content || "";
  }

  async function callB(p, key, model, sys, usr) {
    const r = await fetch(p.url, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": key,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({ model, max_tokens: 1200, system: sys, messages: [{ role: "user", content: usr }] })
    });
    if (!r.ok) throw new Error(`${p.name} ${r.status}: ${(await r.text()).slice(0, 200)}`);
    const j = await r.json();
    return (j.content || []).filter(c => c.type === "text").map(c => c.text).join("\n");
  }

  function parseJSON(text) {
    const clean = text.replace(/```json|```/g, "").trim();
    const s = clean.indexOf("{"), e = clean.lastIndexOf("}");
    return JSON.parse(clean.slice(s, e + 1));
  }

  async function enhance({ provider, key, model, state, built, data }) {
    const p = PROVIDERS[provider];
    if (!p) throw new Error("알 수 없는 프로바이더: " + provider);
    if (!key) throw new Error("API 키가 없음");
    const m = model || p.defaultModel;
    const sys = systemPrompt(data), usr = userPrompt(state, built, data);
    const raw = p.adapter === "A" ? await callA(p, key, m, sys, usr) : await callB(p, key, m, sys, usr);
    const out = parseJSON(raw);
    return {
      styleAdditions: Array.isArray(out.styleAdditions) ? out.styleAdditions.slice(0, 3).map(String) : [],
      sectionDirecting: out.sectionDirecting && typeof out.sectionDirecting === "object" ? out.sectionDirecting : {},
      layerHints: out.layerHints && typeof out.layerHints === "object" ? out.layerHints : {},
      note: out.note ? String(out.note) : ""
    };
  }

  root.SUNO_LLM = { PROVIDERS, enhance };
})(typeof window !== "undefined" ? window : globalThis);

</script>

    }));
    return hits.slice(0, 24);
  }
  function currentItem(p) {
    const k = pks[p]; if (!k.ins) return null;

  function meter(used, limit) {

  });
  out.addEventListener("change", e => {
    const c = e.target.closest("[data-check]"); if (!c) return;
    checkDone[c.dataset.check] = c.checked; S.saveCheck(project.id, checkDone); refresh();
  });
  function flash(node, msg) { const sp = node.querySelector("span"); if (sp) sp.textContent = msg; else node.textContent = msg; node.classList.add("on"); setTimeout(() => node.classList.remove("on"), 1400); }

  /* ================= 하단 실행 바 · 내비 ================= */
  /* Style · Lyrics 복사를 나란히 */
  function renderDock() {
    if (!built) return;
    const used = built.base.styleChars, lim = D.limits.styleChars;
    const st = $("dockStat");
    if (st) st.innerHTML = `Style <b>${used}</b>/${lim}<span class="ly-n"><span class="sep"></span>가사 <b>${built.lyrics.chars}</b></span>`;
    const vu = $("dockVu");
    if (vu) { const segs = 12, on = Math.min(segs, Math.ceil(used / lim * segs));
      let h = ""; for (let i = 0; i < segs; i++) h += `<i class="${i < on ? (used > lim ? "over" : i >= segs - 2 ? "hot" : "on") : ""}"></i>`; vu.innerHTML = h; }
  }
  // 가사칸에서 눌러도 커서와 키보드가 유지되게
  document.querySelectorAll("[data-dock]").forEach(b => {
    b.addEventListener("pointerdown", e => { if (document.activeElement && document.activeElement.id === "f_lyrics") e.preventDefault(); });
    b.onclick = async () => {
      const ly = b.dataset.dock === "lyrics", text = ly ? built.lyrics.text : built.base.style;
      try { await navigator.clipboard.writeText(text); flash($("toast"), ly ? "가사 복사됨" : "Style 복사됨"); flashDock(b); }
      catch { tab = ly ? "lyrics" : "base"; refresh(); goOut(); }
    };
  });
  function flashDock(b) { b.classList.add("done"); clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove("done"), 1200); }

  /* 모바일 브라우저 하단 툴바가 고정 바를 덮는 문제 — 실제로 보이는 영역(visualViewport) 기준으로 끌어올린다 */
  const dock = $("dock"), vv = window.visualViewport;
  function placeDock() {
    if (!vv) return;
    const hidden = Math.max(0, Math.round(window.innerHeight - (vv.height + vv.offsetTop)));
    dock.style.transform = hidden ? `translateY(${-hidden}px)` : "";
    // 키보드가 올라오면 내비 줄은 접고 복사 줄만 남긴다
    dock.classList.toggle("kb", vv.height < window.innerHeight * 0.72 || hidden > 150);
  }
  if (vv) { vv.addEventListener("resize", placeDock); vv.addEventListener("scroll", placeDock); window.addEventListener("resize", placeDock); placeDock(); }
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function goOut() { $("outCard").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" }); }
  let inOut = false;
  function syncNav() {
    const split = state.mode === "split";
    const on = { navOneshot: !inOut && !split, navSplit: !inOut && split, navOut: inOut && tab !== "check", navCheck: inOut && tab === "check" };
    Object.entries(on).forEach(([id, v]) => { const b = $(id); if (b) { if (v) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current"); } });
  }
  document.querySelector(".bnav").addEventListener("click", e => {
    const b = e.target.closest("[data-nav]"); if (!b) return;
    const v = b.dataset.nav;
    if (v === "oneshot" || v === "split") {
      state.mode = v; applyMode(); refresh();
      $("main").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "start" });
    } else {
      tab = v === "check" ? "check" : (tab === "check" ? "base" : tab); refresh(); goOut();
    }
  });
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(es => { es.forEach(x => { inOut = x.isIntersecting; }); syncNav(); }, { rootMargin: "0px 0px -55% 0px" }).observe($("outCard"));
  }

  /* ================= 프로젝트 ================= */
  async function renderProjects() {
    const list = await S.list(); const ul = $("plist"); ul.innerHTML = "";
    if (!list.length) { ul.innerHTML = `<li><span class="nm empty">저장된 프로젝트 없음. 저장하면 여기 쌓이고, 불러오면 보컬·질감 설정을 그대로 이어받습니다.</span></li>`; }
    list.forEach(p => {
      const li = el("li", p.id === project.id ? "cur" : "");
      const nm = esc(p.name || "(이름 없음)");
      li.innerHTML = `<button class="nm" type="button" data-load="${p.id}" title="${nm} 불러오기">${nm}</button><span class="dt">${(p.mode || "").toUpperCase()} ${new Date(p.updatedAt).toLocaleDateString("ko-KR")}</span><button class="btn sm danger" type="button" data-del="${p.id}" aria-label="${nm} 삭제"><svg aria-hidden="true"><use href="#i-trash"/></svg>삭제</button>`;
      ul.appendChild(li);
    });
    $("projHelp").textContent = S.persistent ? "이 기기에만 저장됩니다. 다른 기기로 옮기려면 내보내기 파일을 쓰세요." : "이 환경에서는 저장이 유지되지 않습니다. 내보내기로 파일을 받아두세요.";
  }
  $("plist").addEventListener("click", async e => {
    const ld = e.target.closest("[data-load]"), dl = e.target.closest("[data-del]");
    if (ld) { const p = await S.load(ld.dataset.load); if (!p) return; loadProject(p); }
    if (dl) { if (!confirm("이 프로젝트를 삭제할까요?")) return; await S.remove(dl.dataset.del); if (project.id === dl.dataset.del) { project = { id: null, name: "" }; $("projName").value = ""; } renderProjects(); refresh(); }
  });
  async function loadProject(p) {
    state = Object.assign(R.defaultState(), p.state); layersAuto = false;
    project = { id: p.id, name: p.name }; $("projName").value = p.name || "";
    checkDone = await S.loadCheck(p.id);
    renderForm(); syncGenreChips(); renderProjects(); refresh();
    await S.setCurrent(p.id);
  }
  $("saveBtn").onclick = async () => {
    const name = $("projName").value.trim() || state.title.trim() || "제목 없음 " + new Date().toLocaleDateString("ko-KR");
    project.name = name;
    const r = await S.save({ id: project.id, name, state });
    project.id = r.id; await S.saveCheck(project.id, checkDone);
    $("projName").value = name; renderProjects(); refresh(); flash($("toast"), "저장됨");
  };
  $("newBtn").onclick = () => { if (!confirm("새 곡을 시작할까요? 저장하지 않은 입력은 사라집니다.")) return; state = R.defaultState(); project = { id: null, name: "" }; checkDone = {}; $("projName").value = ""; renderForm(); renderProjects(); refresh(); };
  $("resetBtn").onclick = () => { if (!confirm("입력을 초기화할까요? 프로젝트 이름은 유지됩니다.")) return; const m = state.mode; state = R.defaultState(); state.mode = m; renderForm(); refresh(); };
  $("exportBtn").onclick = async () => {
    const json = await S.exportAll(); const blob = new Blob([json], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `suno-projects-${new Date().toISOString().slice(0, 10)}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const n = await S.importAll(await f.text(), true); flash($("toast"), `${n}개 가져옴`); renderProjects(); }
    catch (err) { alert(err.message); }
    e.target.value = "";
  };

  /* ================= LLM ================= */
  const provSel = $("llmProvider");
  Object.entries(L.PROVIDERS).forEach(([id, p]) => provSel.appendChild(el("option", "", esc(p.name))).value = id);
  async function loadKeyUI() { const keys = await S.getKeys(); const k = keys[provSel.value]; $("llmKey").value = k ? k.key : ""; $("llmModel").value = k ? k.model : ""; $("llmModel").placeholder = "기본: " + L.PROVIDERS[provSel.value].defaultModel; }
  provSel.onchange = loadKeyUI;
  $("llmSaveKey").onclick = async () => { await S.setKey(provSel.value, $("llmKey").value.trim(), $("llmModel").value.trim()); flash($("llmToast"), "이 기기에 저장됨"); };
  $("llmClearKey").onclick = async () => { await S.setKey(provSel.value, ""); $("llmKey").value = ""; flash($("llmToast"), "삭제됨"); };
  $("llmRun").onclick = async () => {
    const key = $("llmKey").value.trim(); if (!key) { flash($("llmToast"), "키가 없음"); return; }
    const btn = $("llmRun"); btn.disabled = true; btn.textContent = "생각 중…";
    try {
      const r = await L.enhance({ provider: provSel.value, key, model: $("llmModel").value.trim(), state, built, data: D });
      state.extraStyle = r.styleAdditions;
      state.sectionOverrides = r.sectionDirecting;
      Object.entries(r.layerHints).forEach(([id, hint]) => { const l = state.layers.find(x => x.id === id); if (l && !l.detail) l.detail = hint; });
      renderLayers(); refresh();
      const note = $("llmNote"); note.hidden = false;
      note.innerHTML = `<div>${esc(r.note || "제안을 반영했습니다.")}</div><div class="help">추가된 디스크립터: ${r.styleAdditions.length ? esc(r.styleAdditions.join(", ")) : "없음"} · 섹션 디렉팅 ${Object.keys(r.sectionDirecting).length}개 · 레이어 힌트 ${Object.keys(r.layerHints).length}개. <button class="btn sm" type="button" id="llmUndo">제안 되돌리기</button></div>`;
      $("llmUndo").onclick = () => { state.extraStyle = []; state.sectionOverrides = {}; state.layers.forEach(l => { if (r.layerHints[l.id] === l.detail) l.detail = ""; }); renderLayers(); refresh(); note.hidden = true; };
      flash($("llmToast"), "반영됨");
    } catch (err) { $("llmNote").hidden = false; $("llmNote").textContent = "추천 실패: " + err.message + " — 키와 모델명을 확인하고 다시 시도하세요."; }
    finally { btn.disabled = false; btn.textContent = "추천 받기"; }
  };

  /* ================= 시작 ================= */
  (async function init() {
    $("dataver").textContent = `데이터 ${D.version}, ${D.targetModel} 기준`;
    const cur = await S.currentId(); const p = cur ? await S.load(cur) : null;
    if (p) await loadProject(p);
    else { renderForm(); renderProjects(); refresh(); }
    await loadKeyUI();
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
  })();
})();

</script>
</body>
</html>
